name: Update landing frontend

on:
  schedule: # once a day
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_version.outputs.skip || steps.check_existing_pr.outputs.skip }}
      current_version: ${{ steps.check_version.outputs.current_version }}
      latest_version: ${{ steps.latest_frontend_version.outputs.latest_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Get latest mc_fd release
        id: latest_frontend_version
        uses: abatilo/release-info-action@v1.3.3
        with:
          owner: muthur-command
          repo: mc_fd
      - name: Check if version is up to date
        id: check_version
        run: |
          current_version="$(cat .mc-frontend-version)"
          latest_version="${{ steps.latest_frontend_version.outputs.latest_tag }}"
          echo "current_version=${current_version}" >> $GITHUB_OUTPUT
          echo "LATEST_VERSION=${latest_version}" >> $GITHUB_ENV
          if [[ ! "$current_version" < "$latest_version" ]]; then
            echo "Landing frontend version is up to date"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
      - name: Check if there is no open PR with this version
        if: steps.check_version.outputs.skip != 'true'
        id: check_existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --state open --base mc --json title --search "Update landing frontend to version $LATEST_VERSION")
          if [[ "$PR" != "[]" ]]; then
            echo "Skipping - There is already a PR open for version $LATEST_VERSION"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
  create-pr:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.skip != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Clear www folder
        run: |
          rm -rf rootfs/usr/share/www/*
      - name: Update version file
        run: |
          echo "${{ needs.check-version.outputs.latest_version }}" > .muthur-command-frontend-version
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          repository: 'muthur-command/mc_fd'
          tag: ${{ needs.check-version.outputs.latest_version }}
          fileName: muthur_command_frontend_landingpage-${{ needs.check-version.outputs.latest_version }}.tar.gz
          extract: true
          out-file-path: rootfs/usr/share/www/
      - name: Remove release assets archive
        run: |
          rm -f rootfs/usr/share/www/muthur_command_frontend_landingpage-*.tar.gz
      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update landing frontend to version ${{ needs.check-version.outputs.latest_version }}"
          branch: autoupdate-frontend
          base: mc
          draft: true
          sign-commits: true
          title: "Update landing frontend to version ${{ needs.check-version.outputs.latest_version }}"
          body: >
            Update landing frontend from ${{ needs.check-version.outputs.current_version }} to
            [${{ needs.check-version.outputs.latest_version }}](https://github.com/muthur-command/mc_fd/releases/tag/${{ needs.check-version.outputs.latest_version }})

