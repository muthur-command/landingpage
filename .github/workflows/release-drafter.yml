name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - mc

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find Next Version
        id: version
        run: |
          declare -i newpost
          datepre=$(date --utc '+%Y.%m')
          tag_commit=$(git rev-list --tags --max-count=1 2>/dev/null || true)
          latest=""
          if [ -n "$tag_commit" ]; then
            latest=$(git describe --tags --abbrev=0 "$tag_commit" 2>/dev/null || true)
          fi
          if [ -z "$latest" ]; then
            newpost=0
          else
            latestpre=$(echo "$latest" | awk '{split($0,a,"."); print a[1] "." a[2]}')
            if [[ "$latestpre" == "$datepre" ]]; then
              latestpost=$(echo "$latest" | awk '{split($0,a,"."); print a[3]}')
              newpost=$latestpost+1
            else
              newpost=0
            fi
          fi
          echo "Current version:    ${latest:-<no tags yet>}"
          echo "New target version: $datepre.$newpost"
          echo "version=$datepre.$newpost" >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
