name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - mc

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find Next Version
        id: version
        run: |
          declare -i newpost
          # SemVer forbids leading zeros in numeric segments (e.g. 2026.04.0 is invalid — use 2026.4.0).
          datepre="$(date --utc +%Y).$(date --utc +%-m)"
          tag_commit=$(git rev-list --tags --max-count=1 2>/dev/null || true)
          latest=""
          if [ -n "$tag_commit" ]; then
            latest=$(git describe --tags --abbrev=0 "$tag_commit" 2>/dev/null || true)
          fi
          if [ -z "$latest" ]; then
            newpost=0
          else
            latestpre=$(echo "$latest" | awk -F. '{printf "%d.%d\n", $1+0, $2+0}')
            if [[ "$latestpre" == "$datepre" ]]; then
              latestpost=$(echo "$latest" | awk -F. '{print $3+0}')
              newpost=$latestpost+1
            else
              newpost=0
            fi
          fi
          ver="${datepre}.${newpost}"
          echo "Current version:    ${latest:-<no tags yet>}"
          echo "New target version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
