name: Build landingpage

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images to registry and update version repo"
        type: boolean
        default: true
  pull_request:
    branches: ["mc"]
  release:
    types: ["published"]

env:
  BUILD_NAME: landingpage
  BUILD_TYPE: landingpage

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: Initialize build
    if: github.repository_owner == 'muthur-command'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      extra_tags: ${{ steps.tags.outputs.extra_tags }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: version
        uses: muthur-command/actions/helpers/version@mc
        with:
          type: ${{ env.BUILD_TYPE }}

      - name: Verify version
        if: github.event_name == 'release'
        uses: muthur-command/actions/helpers/verify-version@mc
        with:
          ignore-dev: true

      - name: Compute extra tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${VERSION}" =~ d ]]; then
            echo "extra_tags=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${VERSION}" =~ b ]]; then
            echo "extra_tags=beta" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tags=stable" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.machine }} landingpage
    if: github.repository_owner == 'muthur-command'
    needs: init
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        machine:
          # amd64 targets:
          - generic-x86-64
          - qemux86-64
          # arm64 targets:
          - khadas-vim3
          - odroid-c2
          - odroid-c4
          - odroid-m1
          - odroid-n2
          - qemuarm-64
          - raspberrypi3-64
          - raspberrypi4-64
          - raspberrypi5-64
          - yellow
          - green
          - neardi-pi-3
        include:
          # Default: aarch64 on native ARM runner (must come before amd64 overrides)
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
          # Overrides for amd64 machines
          - machine: generic-x86-64
            arch: amd64
            runs-on: ubuntu-24.04
          - machine: qemux86-64
            arch: amd64
            runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build landingpage
        uses: muthur-command/builder/actions/build-image@2026.06.2
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign-identity: "https://github.com/muthur-command/landingpage/.*"
          image: ghcr.io/muthur-command/${{ matrix.machine }}-landingpage
          image-tags: |
            ${{ needs.init.outputs.version }}
            ${{ needs.init.outputs.extra_tags }}
          push: ${{ needs.init.outputs.publish == 'true' }}
          version: ${{ needs.init.outputs.version }}

  publish_version:
    name: Publish version files
    environment: ${{ needs.init.outputs.channel || 'dev' }}
    if: |
      github.repository_owner == 'muthur-command'
      && needs.init.outputs.publish == 'true'
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize git
        uses: muthur-command/actions/helpers/git-init@mc
        with:
          name: ${{ secrets.GIT_NAME }}
          email: ${{ secrets.GIT_EMAIL }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update version file
        uses: muthur-command/actions/helpers/version-push@mc
        with:
          key: ${{ env.BUILD_NAME }}
          key-description: "Muthur Command landingpage"
          version: ${{ needs.init.outputs.version }}
          channel: ${{ needs.init.outputs.channel || 'dev' }}

      - name: Update version file (stable -> beta)
        if: needs.init.outputs.channel == 'stable'
        uses: muthur-command/actions/helpers/version-push@mc
        with:
          key: ${{ env.BUILD_NAME }}
          key-description: "Muthur Command landingpage"
          version: ${{ needs.init.outputs.version }}
          channel: beta
